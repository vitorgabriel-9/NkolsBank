<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>

    <h1>Cadastro</h1>

    <form id="formCadastro">

        <input
            type="text"
            id="nome"
            placeholder="Nome"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="senha"
            placeholder="Senha"
            required
        >

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <script src="js/cadastro.js"></script>

</body>

</html>
