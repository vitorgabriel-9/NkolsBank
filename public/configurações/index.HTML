<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkolsBank - Configurações</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="main-header">
        <div class="logo-area">
            <img src="../icons/favicon.ico" alt="NkolsBank" class="logo-icon">
            <span>NkolsBank</span>
        </div>
        <div class="user-greeting">
            <h1>Configurações</h1>
            <p>Gerencie sua conta e segurança</p>
        </div>
    </header>

    <main class="settings-main">
        <div class="settings-list">

            <div class="settings-item">
                <div class="item-content">
                    <i class="fas fa-user"></i>
                    <span>Dados Pessoais</span>
                </div>
                <i class="fas fa-chevron-right"></i>
            </div>

            <div class="settings-item">
                <div class="item-content">
                    <i class="fas fa-shield-alt"></i>
                    <span>Segurança</span>
                </div>
                <i class="fas fa-chevron-right"></i>
            </div>

            <div class="settings-item">
                <div class="item-content">
                    <i class="fas fa-bell"></i>
                    <span>Notificações</span>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="settings-item logout">
                <div class="item-content">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair da Conta</span>
                </div>
            </div>

        </div>
    </main>

    <nav id="footer">
        <div class="div-botao-footer">
            <a class="link-nav" href="../inicio/index.html"><img src="../icons/inicio.png" alt="Início"></a>
        </div>
        <div class="div-botao-footer">
            <img src="../icons/configuracoes.png" alt="Configurações">
            <p>Configurações</p>
        </div>
    </nav>

</body>

</html>
