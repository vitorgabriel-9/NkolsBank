<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkolsBank</title>
    
    <link rel="shortcut icon" href="/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-header">
        <img src="/icons/favicon.ico" style="width: 35px;" alt="Ícone do App">
        <a href="/inicio/index.html" style="padding: 8px 5px; color: blue;">NkolsBank</a>
    </div>

    <div class="hero-banner">
        <h1>Minhas Estatísticas</h1>
        <p>Análise de gastos detalhada</p>
    </div>

    <div class="container">
        
        <div class="resumo-cards">
            <div class="card receitas">
                <span>Total Recebido</span>
                <p id="saldo">R$ 2.500,00</p>
            </div>
            <div class="card despesas">
                <span>Total Gasto</span>
                <p id="totalGastoTexto">R$ 0,00</p>
            </div>
        </div>

        <div class="form-section">
            <h3>Classificar Novo Gasto</h3>
            <form id="gastoForm">
                <div class="form-group">
                    <input type="number" id="valorGasto" placeholder="Valor (R$)" step="0.01" required>
                    
                    <select id="categoriaGasto" required>
                        <option value="" disabled selected>Escolha a área...</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Contas">Contas</option>
                    </select>
                    
                    <button type="submit" class="btn-add" id="concluir">+</button>
                </div>
            </form>
        </div>

        <div class="chart-section">
            <h3>Gastos por Categoria</h3>
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="chart-section">
            <h3>Evolução do Saldo (Últimos 4 meses)</h3>
            <div class="chart-container">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
