<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkolsBank - Estatísticas</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div class="app-header">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#0d47a1" style="margin-right: 8px;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
        </svg>
        NkolsBank
    </div>

    <div class="hero-banner">
        <h1>Minhas Estatísticas</h1>
        <p>Análise de gastos detalhada</p>
    </div>

    <div class="container">
        
        <div class="resumo-cards">
            <div class="card receitas">
                <span>Total Recebido</span>
                <p>+ R$ 2.500,00</p>
            </div>
            <div class="card despesas">
                <span>Total Gasto</span>
                <p id="totalGastoTexto">- R$ 1.240,00</p>
            </div>
        </div>

        <div class="form-section">
            <h3>Classificar Novo Gasto</h3>
            <form id="gastoForm">
                <div class="form-group">
                    <input type="number" id="valorGasto" placeholder="Valor (R$)" step="0.01" required>
                    
                    <select id="categoriaGasto" required>
                        <option value="" disabled selected>Escolha a área...</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Contas">Contas</option>
                    </select>
                    
                    <button type="submit" class="btn-add">+</button>
                </div>
            </form>
        </div>

        <div class="chart-section">
            <h3>Gastos por Categoria</h3>
            <div class="chart-container">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="chart-section">
            <h3>Evolução do Saldo (Últimos 4 meses)</h3>
            <div class="chart-container">
                <canvas id="evolutionChart"></canvas>
            </div>
        </div>

    </div>

    <nav class="bottom-nav">
        <button class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Início
        </button>
        <button class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
            Ajustes
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
