<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NkolsBank</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="icons/favicon.ico" type="image/x-icon">
</head>

<body>

    <div class="container">

        <div class="login-box">

            <h1>NkolsBank</h1>

            <p>Acesse sua conta com segurança</p>

            <form id="formLogin">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Senha"
                    required
                    title="Não use espaços"
                >

                <div class="opcoes">
                    <a href="cadastro.html">Novo Usuário: Cadastrar-se</a>
                </div>

                <button type="submit">
                    Entrar
                </button>

                <div class="loading" id="loading"></div>

                <span id="msg"></span>

            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
